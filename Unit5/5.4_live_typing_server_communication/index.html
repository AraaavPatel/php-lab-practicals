<!DOCTYPE html>
<html>
<body>
<h2>Live Search</h2>

<input type="text" id="search" placeholder="Type something..." onkeyup="searchText()">
<div id="result"></div>

<script>
function searchText() {
    var value = document.getElementById("search").value;

    if (value.length == 0) {
        document.getElementById("result").innerHTML = "";
        return;
    }

    var xhr = new XMLHttpRequest();
    xhr.open("GET", "search.php?q=" + encodeURIComponent(value), true);

    xhr.onload = function() {
        if (xhr.status == 200) {
            document.getElementById("result").innerHTML = xhr.responseText;
        }
    };

    xhr.send();
}
</script>
</body>
</html>
